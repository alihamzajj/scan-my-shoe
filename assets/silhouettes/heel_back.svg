<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <!-- Rear Heel Silhouette -->
  <!-- Outsole Base Line -->
  <path d="M 170,340 C 210,345 290,345 330,340" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" />
  <!-- Heel Cup & Collar Contour (Hourglass sneaker rear) -->
  <path d="M 170,340 C 160,300 160,250 180,210 C 200,170 205,140 195,90 C 215,80 285,80 305,90 C 295,140 300,170 320,210 C 340,250 340,300 330,340 Z" 
        stroke="#60A5FA" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Heel Tab / Pull Loop -->
  <rect x="235" y="55" width="30" height="40" rx="6" stroke="#93C5FD" stroke-width="2" />
  <!-- Midsole Stitch Band -->
  <path d="M 165,315 C 220,320 280,320 335,315" stroke="#93C5FD" stroke-width="2" stroke-dasharray="5 4" />
  <!-- Heel Counter Overlay Curve -->
  <path d="M 180,220 C 220,240 280,240 320,220" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />
  <!-- Center Vertical Alignment Axis -->
  <line x1="250" y1="40" x2="250" y2="360" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7" />
  <!-- Label -->
  <text x="250" y="380" font-family="sans-serif" font-size="14" fill="#93C5FD" font-weight="600" text-anchor="middle" letter-spacing="2">HEEL &amp; REAR SYMMETRY</text>
</svg>
